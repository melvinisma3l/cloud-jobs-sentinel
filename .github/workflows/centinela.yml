name: Centinela Nocturno de Empleos 24/7

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias necesarias
        run: pip install requests openpyxl

      - name: Ejecutar Centinela Maestro V3
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python centinela_maestro_v3.py

      - name: Poner Reporte Excel Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-Maestro-Cloud
          path: Cloud_Master_Jobs_Report.xlsx
